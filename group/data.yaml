research:
  - title: "Language model agents"
    image: "../images/vwa.png"
    text: "Benchmarks and methods for agents that carry out long-horizon tasks on the web and computers, and improve from experience."
    papers:
      - "VisualWebArena: Evaluating Multimodal Agents on Realistic Visual Web Tasks"
      - "Inducing Programmatic Skills for Agentic Tasks"
      - "Agent Workflow Memory"
  - title: "Code generation and software engineering"
    image: "../images/hybridgym.png"
    text: "Environments and training methods for coding agents that generalize across tasks and repositories."
    papers:
      - "Hybrid-Gym: Training Coding Agents to Generalize Across Tasks"
      - "Toward Training Superintelligent Software Agents through Self-Play SWE-RL"
      - "RepoST: Scalable Repository-Level Coding Environment Construction with Sandbox Testing"
  - title: "Pragmatics and human-AI interaction"
    image: "../images/convention.png"
    text: "How can models infer what people mean, not just what they say, and communicate with them efficiently?"
    papers:
      - "Success and Cost Elicit Convention Formation for Efficient Communication"
      - "Generating Pragmatic Examples to Train Neural Program Synthesizers"
      - "mrCAD: Multimodal Refinement of Computer-aided Designs"
  - title: "Multi-agent dynamics"
    image: "../images/diplomacy.png"
    text: "How do language models negotiate, form coalitions, and handle conflicting values, with each other and with people?"
    papers:
      - "Generative Value Conflicts Reveal LLM Priorities"
      - "Measuring Fine-Grained Negotiation Tactics of Humans and LLMs in Diplomacy"
      - "Human-Level Play in the Game of Diplomacy by Combining Language Models with Strategic Reasoning"
  - title: "Reasoning"
    image: "../images/latent-tokens.png"
    text: "Training and inference methods for reasoning in language models."
    papers:
      - "Reasoning with Latent Tokens in Diffusion Language Models"
      - "Rewarding the Unlikely: Lifting GRPO Beyond Distribution Sharpening"
      - "Propose, Solve, Verify: Self-Play Through Formal Verification"

join:
  - 'We recruit PhD and MLT students through the <a href="https://lti.cs.cmu.edu/">Language Technologies Institute</a> at Carnegie Mellon University. Applications go through LTI graduate admissions, with deadlines in early December.'
  - 'See <a href="https://dpfried.github.io/prospective.html">the page for prospective students</a> for whether we are recruiting this cycle and how to apply.'

