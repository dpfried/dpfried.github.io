group:
  name: "LAIR"
  tagline: "Language Agents, Interaction, Reasoning"
  affiliation: "Language Technologies Institute, Carnegie Mellon University"
  description: >
    Our group works on language, reasoning, and interaction for AI systems that
    act in the world — writing code, navigating computers, and collaborating with
    people. Our research spans three connected threads: agents that reason, search,
    and learn from experience; pragmatic interaction between models and people;
    and multi-agent dynamics such as negotiation, value alignment, and coalition
    formation.
  group_photo: "../images/group-2026.jpg"
  pi:
    name: "Daniel Fried"
    title: "Assistant Professor"
    url: "https://dpfried.github.io"
    photo: "../daniel.jpg"
    email: "dfried@cs.cmu.edu"
  founded: 2022

